<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>快乐游园日 | 蓝天白云</title>
  <meta name="description" content="蓝天白云下，小朋友们在草地上放风筝、踢球、嬉戏玩耍的快乐主页。" />
  <style>
    :root{
      --sky1:#9bd4ff;
      --sky2:#d8f0ff;
      --sun:#ffd35a;
      --grass:#66c06a;
      --hill:#5bb760;
      --cloud:#ffffff;
      --cloud-shadow:#e7f6ff;
      --ink:#155;
      --ink-soft:#277;
      --panel:#ffffff;
      --panel-shadow:rgba(0,0,0,.08);
      --accent:#ff7a59;
      --accent-2:#ffb457;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
      color:#09343a;
      background:linear-gradient(to bottom,var(--sky2) 0%,var(--sky1) 60%, var(--grass) 60%, var(--grass) 100%);
      overflow-x:hidden;
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    /* 顶部导航 */
    .nav{
      position:fixed;left:0;right:0;top:0;
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 20px;
      backdrop-filter:saturate(120%) blur(6px);
      background:rgba(255,255,255,.35);
      border-bottom:1px solid rgba(255,255,255,.4);
      z-index:10;
    }
    .brand{
      display:flex;align-items:center;gap:10px;font-weight:700;color:#06424a
    }
    .brand .logo{
      width:28px;height:28px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #fff 0 25%, var(--sun) 26% 60%, #f9b23c 61% 100%);
      box-shadow:0 0 0 3px rgba(255,255,255,.6) inset, 0 2px 8px rgba(0,0,0,.08);
    }
    .menu{display:flex;gap:14px}
    .menu a{padding:6px 10px;border-radius:8px;color:#0a5058}
    .menu a:hover{background:rgba(255,255,255,.6)}
    /* 英雄区：天空、太阳、云、草地 */
    .hero{
      position:relative;
      min-height:78vh;
      padding-top:64px;
      overflow:hidden;
      isolation:isolate;
    }
    .sun{
      position:absolute;top:70px;left:50%;transform:translateX(-50%);
      width:120px;height:120px;border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #fff 0 20%, var(--sun) 21% 60%, #ffbf38 61% 100%);
      box-shadow:0 0 40px rgba(255,211,90,.6);
    }
    .sun:after{
      content:"";
      position:absolute;inset:-18px;
      border-radius:50%;
      background:
        conic-gradient(from 0deg, rgba(255,211,90,.0) 0 10deg, rgba(255,211,90,.55) 10deg 20deg, rgba(255,211,90,.0) 20deg 30deg);
      animation:spin 18s linear infinite;
      mask: radial-gradient(circle, transparent 62%, black 63%);
    }
    @keyframes spin{to{transform:rotate(1turn)}}
    /* 云朵 */
    .cloud{
      position:absolute;top:8%;left:-30%;
      width:200px;height:60px;
      background:var(--cloud);
      border-radius:50px;
      box-shadow:
        30px 10px 0 10px var(--cloud),
        80px -5px 0 15px var(--cloud),
        120px 5px 0 5px var(--cloud),
        0 8px 0 0 var(--cloud-shadow) inset;
      opacity:.95;
      animation:drift 60s linear infinite;
    }
    .cloud.c2{top:18%;animation-duration:75s;transform:scale(1.2);opacity:.9}
    .cloud.c3{top:28%;animation-duration:95s;transform:scale(1.6);opacity:.85}
    @keyframes drift{
      from{transform:translateX(0) scale(var(--s,1))}
      to{transform:translateX(140vw) scale(var(--s,1))}
    }
    /* 草地和山坡 */
    .hills{
      position:absolute;left:0;right:0;bottom:0;height:40vh;min-height:200px;pointer-events:none;
    }
    .hill{
      position:absolute;bottom:-10vh;border-radius:50%;
      background:var(--hill);filter:saturate(105%);
      box-shadow:0 -10px 40px rgba(0,0,0,.06) inset;
    }
    .hill.h1{width:90vw;height:55vh;left:-20vw}
    .hill.h2{width:70vw;height:40vh;right:-10vw;bottom:-6vh;background:#57b05d}
    .ground{
      position:absolute;left:0;right:0;bottom:0;height:18vh;min-height:120px;background:var(--grass);
      box-shadow:0 -8px 24px rgba(0,0,0,.06) inset;
    }
    /* 标题面板 */
    .panel{
      position:relative;
      max-width:980px;margin:0 auto;padding:22vh 16px 0;
      text-align:center;
    }
    h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px);color:#06424a;letter-spacing:.5px}
    .subtitle{color:#0f5962;font-size:clamp(14px,2.6vw,18px)}
    .cta{
      margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap
    }
    .btn{
      display:inline-block;padding:10px 16px;border-radius:999px;font-weight:600;border:0;cursor:pointer
    }
    .btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(255,122,89,.3)}
    .btn.secondary{background:var(--panel);color:#0a5058;border:1px solid #bfeef5}
    .btn:active{transform:translateY(1px)}
    /* 场景前景：孩子和玩具（SVG） */
    .scene{
      position:relative;margin-top:26vh;min-height:260px;
      display:flex;align-items:flex-end;justify-content:center;gap:18vw;pointer-events:none;
    }
    .kid{width:min(26vw,260px);height:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.08))}
    /* 信息卡片 */
    .cards{
      max-width:1000px;margin:40px auto;padding:0 16px;display:grid;gap:14px;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    }
    .card{
      background:var(--panel);border-radius:14px;padding:16px;border:1px solid #dff4f7;
      box-shadow:0 6px 18px var(--panel-shadow)
    }
    .card h3{margin:0 0 6px;font-size:18px;color:#0e5660}
    .card p{margin:0;color:#2b6a72;font-size:14px}
    /* 页脚 */
    footer{padding:28px 16px 40px;text-align:center;color:#1a6e77}
    /* 响应式微调 */
    @media (max-width:640px){
      .scene{gap:10vw;margin-top:20vh}
      .sun{width:96px;height:96px}
    }
  </style>
</head>
<body>
  <header class="nav" role="navigation" aria-label="主导航">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <span>快乐游园日</span>
    </div>
    <nav class="menu">
      <a href="#activities">活动</a>
      <a href="#gallery">相册</a>
      <a href="#about">关于</a>
    </nav>
  </header>

  <main class="hero">
    <!-- 太阳 -->
    <div class="sun" role="img" aria-label="温暖的太阳"></div>
    <!-- 飘动的云 -->
    <div class="cloud c1" aria-hidden="true" style="--s:1"></div>
    <div class="cloud c2" aria-hidden="true" style="--s:1.2"></div>
    <div class="cloud c3" aria-hidden="true" style="--s:1.6"></div>

    <!-- 标题与按钮 -->
    <section class="panel" aria-labelledby="title">
      <h1 id="title">蓝天白云下的童年</h1>
      <p class="subtitle">放风筝、踢皮球、捉迷藏，笑声在草地上回荡。</p>
      <div class="cta" role="group" aria-label="快速操作">
        <a class="btn primary" href="#activities">马上玩</a>
        <a class="btn secondary" href="#gallery">看看相册</a>
      </div>
    </section>

    <!-- 小山坡和草地 -->
    <div class="hills" aria-hidden="true">
      <div class="hill h1"></div>
      <div class="hill h2"></div>
      <div class="ground"></div>
    </div>

    <!-- 前景插画：两个小朋友 -->
    <section class="scene" aria-label="孩子们在草地上玩耍">
      <!-- 左：放风筝的小朋友 -->
      <svg class="kid" viewBox="0 0 220 220" role="img" aria-label="小朋友在放风筝">
        <title>放风筝</title>
        <defs>
          <linearGradient id="kiteG" x1="0" x2="1">
            <stop offset="0" stop-color="#ff7a59"/>
            <stop offset="1" stop-color="#ffb457"/>
          </linearGradient>
        </defs>
        <!-- 风筝 -->
        <g transform="translate(150,20)">
          <polygon points="0,0 28,18 0,36 -28,18" fill="url(#kiteG)" stroke="#e05836" stroke-width="2"/>
          <path d="M0,36 c-6,10 -10,18 -24,28" stroke="#e05836" stroke-width="2" fill="none"/>
          <circle cx="-24" cy="64" r="3" fill="#ff7a59"/>
          <circle cx="-36" cy="76" r="3" fill="#ffb457"/>
        </g>
        <!-- 线 -->
        <path d="M126,86 C120,110 98,126 76,140" stroke="#e05836" stroke-width="1.5" fill="none" />
        <!-- 小朋友（简笔） -->
        <g stroke="#155" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(50,120)">
          <circle cx="0" cy="-24" r="12" fill="#fff" stroke="#155"/>
          <path d="M0,-12 L0,36" /> <!-- 身体 -->
          <path d="M0,8 L-18,26" /> <!-- 左腿 -->
          <path d="M0,8 L16,28" /> <!-- 右腿 -->
          <path d="M0,-2 L-22,10" /> <!-- 左臂 -->
          <path d="M0,-2 L28,-10" /> <!-- 右臂（牵线） -->
        </g>
        <!-- 草丛点缀 -->
        <g stroke="#4aa85b" stroke-width="3" stroke-linecap="round">
          <path d="M16,200 L16,184" />
          <path d="M28,200 L28,186" />
          <path d="M40,200 L40,182" />
        </g>
      </svg>

      <!-- 右：踢球的小朋友 -->
      <svg class="kid" viewBox="0 0 220 220" role="img" aria-label="小朋友在踢球">
        <title>踢球</title>
        <!-- 球 -->
        <g transform="translate(150,176)">
          <circle cx="0" cy="0" r="14" fill="#fff" stroke="#155" stroke-width="3"/>
          <g stroke="#155" stroke-width="2">
            <path d="M-10,0 L10,0" />
            <path d="M0,-10 L0,10" />
            <path d="M-7,-7 L7,7" />
            <path d="M-7,7 L7,-7" />
          </g>
          <animateTransform attributeName="transform" type="translate"
            values="150,176; 150,172; 150,176" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <!-- 小朋友（简笔） -->
        <g stroke="#155" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(66,110)">
          <circle cx="0" cy="-24" r="12" fill="#fff" stroke="#155"/>
          <path d="M0,-12 L0,34" /> <!-- 身体 -->
          <path d="M0,8 L-16,28" /> <!-- 左腿 -->
          <path d="M0,8 L20,14" /> <!-- 右腿抬起 -->
          <path d="M0,-2 L-22,10" /> <!-- 左臂 -->
          <path d="M0,-2 L22,2" /> <!-- 右臂 -->
        </g>
        <!-- 小花 -->
        <g transform="translate(28,180)">
          <circle cx="0" cy="0" r="3" fill="#ff7a59"/>
          <circle cx="6" cy="-4" r="3" fill="#ffb457"/>
          <circle cx="6" cy="4" r="3" fill="#ffd35a"/>
          <circle cx="12" cy="0" r="3" fill="#66c06a"/>
        </g>
      </svg>
    </section>
  </main>

  <!-- 信息卡片 -->
  <section id="activities" class="cards" aria-label="活动">
    <article class="card">
      <h3>今日活动</h3>
      <p>放风筝、接力跑、画石头，小伙伴自由组队，一起出发！</p>
    </article>
    <article class="card">
      <h3>安全小贴士</h3>
      <p>结伴而行、不追逐打闹、注意补水，开心也要注意安全。</p>
    </article>
    <article class="card" id="gallery">
      <h3>相册</h3>
      <p>拍下你的笑脸与风筝的形状，珍藏今天的晴空。</p>
    </article>
    <article class="card" id="about">
      <h3>关于我们</h3>
      <p>社区亲子日，带孩子亲近自然，在玩耍中探索、在合作中成长。</p>
    </article>
  </section>

  <footer>
    <small>© 2025 快乐游园日 · 蓝天白云下见啦</small>
  </footer>

  <script>
    // 轻微“风速变化”：调整云动画速度，纯前端无依赖
    (function(){
      const clouds = document.querySelectorAll('.cloud');
      function gust(){
        const v = 0.9 + Math.random()*0.4; // 0.9x~1.3x
        clouds.forEach((c,i)=>{
          const dur = parseFloat(getComputedStyle(c).animationDuration); // 秒
          c.style.animationDuration = (dur / v) + 's';
        });
      }
      setInterval(gust, 5000);
    })();
  </script>
</body>
</html>
